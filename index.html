<!DOCTYPE html>
<html>
<head>

  <title>~ ~ ~ I N F I N I T E ~ ~ M U T A R A ~ ~ N E B U L A ~ ~ ~</title>
<style type="text/css">
html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
:focus { outline: none; }
#stage { width: 100%; height: 100%; background-color: black; position: relative; }
#stage .loading-progress {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 60%;
  max-width: 400px;
  height: 4px;
  transform: translate(-50%, -50%);
  background-color: #2a1a33;
  border-radius: 2px;
  overflow: hidden;
}
#stage .loading-progress > .bar {
  height: 100%;
  width: 0%;
  background-color: #caacd4;
  transition: width 0.2s ease-out;
}
</style>
<!-- Global Site Tag (gtag.js) - Google Analytics -->

  gtag('js', new Date());

  gtag('config', 'UA-9588164-1');

</head>
<body>
<div id="stage">


  <div class="loading-progress"><div class="bar"></div></div>

</div>
